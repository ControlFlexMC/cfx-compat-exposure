plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'cfx-compat-exposure'
}

def isRelease = project.hasProperty('release')
def modArtifactVersion = (isRelease || !build_id) ? mod_version : "${mod_version}.${build_id}"
version = "${modArtifactVersion}-mc${minecraft_version}-forge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

mixin {
    add sourceSets.main, 'cfx_compat_exposure.refmap.json'
    config 'cfx-compat-exposure.mixins.json'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 双 loader 共享同一份源码（com.ifels.cfx.exposure 与 Mixin 均与 loader 无关）。
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
    }
}

repositories {
    mavenCentral()
    maven { url 'https://cursemaven.com' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // ControlFlex API（纯 Java，与 loader 无关），经 JitPack 解析。
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    // Exposure 1.9.21 (1.20.1 Forge；最低要求 1.9.20)
    // https://www.curseforge.com/minecraft/mc-mods/exposure/files/8218637
    compileOnly 'curse.maven:exposure-871755:8218637'
    compileOnly 'org.jetbrains:annotations:24.0.1'

    annotationProcessor "org.spongepowered:mixin:${mixin_processor_version}:processor"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_license'            : mod_license,
        'mod_description'        : mod_description,
        'minecraft_version'      : minecraft_version,
        'minecraft_version_range': minecraft_version_range,
        'forge_version'          : forge_version,
        'forge_version_range'    : forge_version_range,
        'loader_version_range'   : loader_version_range,
        'controlflex_mod_id'     : controlflex_mod_id,
        'exposure_mod_id'        : exposure_mod_id,
        'controlflex_version_range': controlflex_version_range,
        'exposure_version_range' : exposure_version_range,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'cfx-compat-exposure.mixins.json'
        ])
    }

    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
    finalizedBy 'reobfJar'
}
