plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'cfx-compat-exposure'
}

def isRelease = project.hasProperty('release')
def modArtifactVersion = (isRelease || !build_id) ? mod_version : "${mod_version}.${build_id}"
version = "${modArtifactVersion}-mc${minecraft_version}-neoforge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

// 注意：net.neoforged.moddev（非 legacyforge）不提供 mixin {} DSL。
// 与 cfx-compat-epicfight 的 NeoForge 构建一致：仅配置 Mixin annotation processor，
// 全部 Mixin 均为 remap = false（第三方类目标），无需生成/使用 refmap。

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 双 loader 共享同一份源码（com.ifels.cfx.exposure 与 Mixin 均与 loader 无关）。
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
    }
}

repositories {
    mavenCentral()
    maven { url 'https://cursemaven.com' }
}

dependencies {
    // ControlFlex —— 先用本地 Forge 版 0.8.7 jar 编译（API 部分为纯 Java，与 loader 无关）。
    // TODO: 后续切换为 Maven 依赖：
    //   mavenLocal() → com.ifels.controlflex:controlflex-api:<version>
    //   （或 JitPack → com.github.ControlFlexMC:control-flex-api:<version>）
    compileOnly files('/Users/ifels/Documents/mc/deploy/controlflex-0.8.7-mc1.20.1-forge.jar')
    // Exposure 1.9.18 (1.21.1 NeoForge)
    // https://www.curseforge.com/minecraft/mc-mods/exposure/files/8223555
    compileOnly 'curse.maven:exposure-871755:8223555'
    compileOnly 'org.jetbrains:annotations:24.0.1'

    annotationProcessor "org.spongepowered:mixin:${mixin_processor_version}:processor"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_license'            : mod_license,
        'mod_description'        : mod_description,
        'minecraft_version'      : minecraft_version,
        'minecraft_version_range': minecraft_version_range,
        'neoforge_version'       : neoforge_version,
        'neoforge_version_range' : neoforge_version_range,
        'loader_version_range'   : loader_version_range,
        'java_version'           : java_version,
        'controlflex_mod_id'     : controlflex_mod_id,
        'exposure_mod_id'        : exposure_mod_id,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
