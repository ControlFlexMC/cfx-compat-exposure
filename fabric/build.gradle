plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'cfx-compat-exposure'
}

def isRelease = project.hasProperty('release')
def modArtifactVersion = (isRelease || !build_id) ? mod_version : "${mod_version}.${build_id}"
version = "${modArtifactVersion}-mc${minecraft_version}-fabric"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

loom {
    mixin {
        defaultRefmapName = 'cfx_compat_exposure.refmap.json'
    }

    runs {
        client {
            client()
            runDir 'run-fabric'
        }
    }
}

// Both loaders share the same sources (com.ifels.cfx.exposure and mixins are loader-agnostic).
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
    }
}

repositories {
    mavenCentral()
    maven { url 'https://cursemaven.com' }
    maven { url 'https://jitpack.io' }
    // SpongePowered repo: resolves the SpongeMixin annotation processor on Fabric.
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // ControlFlex API (plain Java, loader-agnostic), resolved from JitPack.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    // Exposure 1.9.20 (1.20.1 Fabric; 1.9.21 has no Fabric release)
    // https://www.curseforge.com/minecraft/mc-mods/exposure/files/7812667
    compileOnly 'curse.maven:exposure-871755:7812667'
    compileOnly 'org.jetbrains:annotations:24.0.1'

    annotationProcessor "org.spongepowered:mixin:${mixin_processor_version}:processor"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def expandProps = [
        'mod_id'            : mod_id,
        'mod_version'       : mod_version,
        'mod_name'          : mod_name,
        'mod_description'   : mod_description,
        'mod_authors'       : mod_authors,
        'mod_license'       : mod_license,
        'minecraft_version' : minecraft_version,
        'fabric_loader_version': fabric_loader_version,
        'java_version'      : java_version,
        'controlflex_version_range': controlflex_version_range,
        'exposure_version_range': exposure_version_range,
    ]

    filesMatching('fabric.mod.json') {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
