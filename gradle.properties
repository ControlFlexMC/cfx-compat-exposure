org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=/Library/Java/JavaVirtualMachines/microsoft-21.jdk/Contents/Home

# Build tools
mixin_processor_version=0.8.5

# Mod (shared by both loader subprojects)
mod_id=cfx_compat_exposure
# 与 ControlFlex 对齐：0.8.7 = ControlFlex 版本，.1 = 兼容补丁序号
mod_version=0.8.7.1
# Auto-incremented by CI; release builds omit this segment
build_id=0
mod_name=Control Flex x Exposure
mod_authors=ifels
mod_license=MIT
mod_description=Exposure viewfinder controller bridge for ControlFlex
maven_group=com.ifels

# Runtime dependency mod ids (provided at runtime)
controlflex_mod_id=controlflex
exposure_mod_id=exposure

# ControlFlex API（纯 Java，与 loader 无关），经 JitPack 解析：
#   com.github.ControlFlexMC:control-flex-api:<version>
# 注意：0.8.7 起 IInteractiveContextRegistrar 的方法由 notifyForeground/notifyBackground
# 改名为 notifyOverlayForeground/notifyOverlayBackground，因此要求 ControlFlex >= 0.8.7。
controlflex_api_version=0.8.7
